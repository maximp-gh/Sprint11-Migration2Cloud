name: Use Yandex Object Storage as a backend

on:
  # вручную во вкладке Actions
  workflow_dispatch:
env:
    YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
    YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
    AWS_ACCESS_KEY_ID: ${{ secrets.Y_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.Y_ACCESS_SECRET }}
jobs:
  terraform_plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # обязательно для OIDC
      contents: read    # обычно нужно для checkout
    outputs:
      yc_token: ${{ steps.IAMtoken.outputs.YC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Получить токен задания рабочего процесса (инструкция на Yandex пока с ошибками)
      # никакие @actions/core и coredemo не нужны. Они падают.
      #https://yandex.cloud/ru/docs/iam/tutorials/wlif-github-integration
      - name: Get Id Token
        uses: actions/github-script@v7
        id: tokenid
        with:
          script: |
            let id_token = await core.getIDToken()
            core.setOutput('id_token', id_token)

      # 2. Обменять токен задания рабочего процесса на IAM-токен сервисного аккаунта в Yandex Cloud
      # Использовал, чтобы получать IAM token на лету по OIDC.
      # необходима настройка сервисного аккаунта в Yandex.
      # SA_ID - идентификатор этого аккаунта
      - name: GetIAMToken
        id: IAMtoken
        run: |
          SA_ID=${{ secrets.SA_ID }}
          IAMTOKEN=$(curl -sH "Content-Type: application/x-www-form-urlencoded" -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange&requested_token_type=urn:ietf:params:oauth:token-type:access_token&audience=$SA_ID&subject_token=${{steps.tokenid.outputs.id_token}}&subject_token_type=urn:ietf:params:oauth:token-type:id_token" -X POST https://auth.yandex.cloud/oauth/token | jq -r '.access_token')
          echo "::add-mask::$IAMTOKEN"
          echo "YC_TOKEN=$(echo $IAMTOKEN | base64 -w0 | base64 -w0)" >> $GITHUB_OUTPUT
          
          echo "DEBUG: IAM token saved (length: ${#IAMTOKEN})"
         
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      # 3. Terraform init/plan/apply — токен читаем из файла,
      #    YC_TOKEN получаем уже в environment на предыдущем шаге
      #    Остальные YC* нужны для развертывания инфраструктуры - в GitHub vars
      #    AWS* нужны для сохранения tfstate в любой S3 backend в terraform - в GitHub secrets
      - name: Terraform init
        working-directory: Task2Advanced
        run: | 
          terraform init
        env:
          YC_TOKEN: ${{ steps.IAMtoken.outputs.YC_TOKEN }}
          
      - name: Terraform Validate
        run: terraform validate
        working-directory: Task2Advanced
        env:
          YC_TOKEN: ${{ steps.IAMtoken.outputs.YC_TOKEN }}

      # TODO: Не проверяем на no change
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: Task2Advanced
        env:
          YC_TOKEN: ${{ steps.IAMtoken.outputs.YC_TOKEN }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: Task2Advanced/tfplan
          retention-days: 1

  apply:
    name: Terraform Apply
    needs: terraform_plan
    runs-on: ubuntu-latest
    environment: terraform-apply   # <-- вот тут срабатывает approval
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        working-directory: Task2Advanced
        run: | 
          terraform init
        env:
          YC_TOKEN: ${{ needs.terraform_plan.outputs.yc_token }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan 
          path: Task2Advanced

      - name: Terraform Apply
        working-directory: Task2Advanced
        run: |
          terraform apply -input=false -auto-approve tfplan
        env:
          YC_TOKEN: ${{ needs.terraform_plan.outputs.yc_token }}

      - name: destroy
        working-directory: Task2Advanced
        run: terraform destroy -auto-approve
        env:
          YC_TOKEN: ${{ needs.terraform_plan.outputs.yc_token }}
      